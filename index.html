<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXUS HINDI STUDIO — Pro Hindi Dubbing &amp; Reality Video Engine</title>
  <style>
    :root {
      --bg: #03050c;
      --card: rgba(11, 18, 36, 0.90);
      --input: #060a15;
      --border: rgba(34, 211, 238, 0.25);
      --cyan: #22d3ee;
      --violet: #a855f7;
      --amber: #fbbf24;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #1b1340 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 36px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      background: rgba(3, 5, 12, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      display: grid; place-items: center; font-weight: 900; color: #03050c;
    }
    .chip-live {
      font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .wrap {
      max-width: 1020px; margin: 18px auto; padding: 0 16px;
      display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 16px;
    }
    @media (max-width: 840px) { .wrap { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .title { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; color: var(--cyan); }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; background: var(--input); border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 13px;
      outline: none; margin-bottom: 12px; font-family: inherit;
    }
    textarea { min-height: 155px; resize: vertical; line-height: 1.5; font-size: 12px; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 11px;
      font-size: 14px; font-weight: 900; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; }
    .btn-save { background: var(--emerald); color: #03050c; margin-top: 10px; }
    .btn-copy {
      padding: 6px 11px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.45);
      background: rgba(251, 191, 36, 0.14); color: var(--amber); font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .bar { width: 100%; height: 11px; background: var(--input); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width 0.25s; }
    .err {
      margin-top: 10px; padding: 10px; border-radius: 9px;
      background: rgba(244, 63, 94, 0.16); border: 1px solid var(--crimson);
      color: #fecdd3; font-size: 12px; display: none;
    }
    video { width: 100%; border-radius: 11px; margin-top: 10px; background: #000; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">NX</div>
      <div>
        <div style="font-weight:900; font-size:15px;">NEXUS HINDI STUDIO</div>
        <div style="font-size:11px; color:var(--cyan);">Emotional Hindi Dubbing • Hinglish Captions • 10–15 Min Ready</div>
      </div>
    </div>
    <div class="chip-live" id="sys-status">Checking Engine...</div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="hdr-row">
        <div class="title">1. VIDEO &amp; HINDI DUBBING SETUP</div>
        <button type="button" class="btn-copy" id="btn-copy-prompt">📋 Copy 10-Min AI Script Prompt</button>
      </div>

      <label for="topic">Video Topic (Hinglish or English)</label>
      <input type="text" id="topic" value="Agar Prithvi Achanak Ghumna Band Kar De?" placeholder="Enter any topic..." />

      <div class="row-2">
        <div>
          <label for="aspect">Video Format</label>
          <select id="aspect">
            <option value="16:9" selected>16:9 YouTube Long (Horizontal)</option>
            <option value="9:16">9:16 YouTube Shorts (Vertical)</option>
          </select>
        </div>
        <div>
          <label for="duration-min">Target Length (Minutes)</label>
          <select id="duration-min">
            <option value="0.8" selected>~1 Minute (Quick Test)</option>
            <option value="5">5 Minutes (Medium Documentary)</option>
            <option value="10">10 Minutes (Full Long Video)</option>
            <option value="15">15 Minutes (Mega Deep-Dive)</option>
          </select>
        </div>
      </div>

      <label for="custom-script">Optional: Paste Custom 10–15 Min Script (From Gemini / ChatGPT)</label>
      <textarea id="custom-script" placeholder="Khali chhodne par app khud Hindi dubbing aur script banayega.&#10;&#10;Ya phir upar 'Copy 10-Min AI Script Prompt' dabakar Gemini/ChatGPT se 40-60 scenes ka script banwa kar yahan paste karein!"></textarea>

      <button class="btn btn-primary" onclick="startRender()">🚀 Generate Pro Hindi Dubbed Video</button>
      <div class="err" id="err-box"></div>
    </div>

    <div class="card">
      <div class="title">2. LIVE DUBBING &amp; STREAMING RENDER</div>
      <div id="scene-txt" style="font-size:13px; font-weight:700;">Ready. Built-in Hindi Male Narrator (Madhur Neural) + Hybrid 3D/Photo Engine active.</div>
      <div class="bar"><div class="fill" id="prog-fill"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);">
        <span id="job-lbl">Job: —</span>
        <span id="pct-lbl">0%</span>
      </div>
      <div id="result-box"></div>
    </div>
  </main>

  <script>
    let pollTimer = null;

    function showErr(msg) {
      const el = document.getElementById("err-box");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        document.getElementById("sys-status").textContent = d.hindi_dubbing ? "Pro Hindi Dubbing Ready" : "FFmpeg Ready";
      } catch (e) {
        document.getElementById("sys-status").textContent = "Waking Server...";
      }
    }

    document.getElementById("btn-copy-prompt").onclick = () => {
      const topicVal = document.getElementById("topic").value.trim() || "Mystery of Bermuda Triangle";
      const prompt = `Write a deeply engaging, emotional, high-retention 10-minute Hindi documentary script on the topic: "${topicVal}".
Create exactly 45 scenes (each scene ~12-15 seconds of spoken Hindi).
Output ONLY pipe-separated lines with NO numbering, NO markdown, and NO extra text, using this exact 8-column format:
Stage Tag | Time/Clock | Visual Mode(choose one: photo, earth_rotation, dual_reality, consequence_map, asteroid_impact, solar_system) | English Wikimedia Photo Search Keyword | Voice Mood(choose one: intense, dramatic, calm) | Short Hinglish Headline | 2-Line Hinglish On-Screen Caption | Expressive Spoken Hindi Dubbing Paragraph in Devanagari Hindi`;

      navigator.clipboard.writeText(prompt).then(() => {
        const btn = document.getElementById("btn-copy-prompt");
        btn.textContent = "✅ 10-Min Prompt Copied!";
        setTimeout(() => btn.textContent = "📋 Copy 10-Min AI Script Prompt", 3000);
      });
    };

    function autoDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startRender() {
      showErr("");
      document.getElementById("result-box").innerHTML = "";
      document.getElementById("prog-fill").style.width = "3%";
      document.getElementById("pct-lbl").textContent = "3%";
      document.getElementById("scene-txt").textContent = "Initializing Pro Hindi Dubbing Engine...";

      const payload = {
        topic: document.getElementById("topic").value.trim(),
        aspect_ratio: document.getElementById("aspect").value,
        duration_min: parseFloat(document.getElementById("duration-min").value || "1.0"),
        custom_script: document.getElementById("custom-script").value
      };

      const r = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) {
        showErr(d.error || "Failed to start render.");
        return;
      }

      const jobId = d.job_id;
      document.getElementById("job-lbl").textContent = `Job: ${jobId}`;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const sr = await fetch(`/api/status/${jobId}`);
          const st = await sr.json();
          if (!sr.ok) {
            clearInterval(pollTimer);
            showErr(st.error || "Status error");
            return;
          }
          document.getElementById("prog-fill").style.width = `${st.progress}%`;
          document.getElementById("pct-lbl").textContent = `${st.progress}%`;
          document.getElementById("scene-txt").textContent = st.current_scene;

          if (st.status === "done") {
            clearInterval(pollTimer);
            const dlUrl = `/api/video/${jobId}?dl=1`;
            autoDownload(dlUrl, st.file_name);
            document.getElementById("result-box").innerHTML = `
              <a class="btn btn-save" href="${dlUrl}" download="${st.file_name}">⬇ Download Hindi MP4 (${st.duration_min} min • ${st.size_mb} MB)</a>
              <video src="/api/video/${jobId}" controls playsinline></video>
            `;
          } else if (st.status === "error") {
            clearInterval(pollTimer);
            showErr(st.error || "Render failed");
          }
        } catch (e) {}
      }, 2000);
    }

    checkHealth();
  </script>
</body>
</html>
