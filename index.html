<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXORA STUDIO ULTRA v8 — High-Speed Retention-Lock Engine</title>
  <style>
    :root {
      --bg: #03050c;
      --card: rgba(11, 18, 36, 0.94);
      --input: #060a15;
      --border: rgba(34, 211, 238, 0.25);
      --cyan: #22d3ee;
      --violet: #a855f7;
      --amber: #fbbf24;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #1f123d 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 40px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      background: rgba(3, 5, 12, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      display: grid; place-items: center; font-weight: 900; color: #03050c;
    }
    .chip-live {
      font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .wrap { max-width: 1060px; margin: 18px auto; padding: 0 16px; display: grid; gap: 16px; }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .title { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; color: var(--cyan); }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], select, textarea {
      width: 100%; background: var(--input); border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 13px;
      outline: none; margin-bottom: 12px; font-family: inherit;
    }
    textarea { min-height: 155px; resize: vertical; line-height: 1.5; font-size: 12px; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px) { .row-2 { grid-template-columns: 1fr; } }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 11px;
      font-size: 14px; font-weight: 900; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; }
    .btn-green { background: var(--emerald); color: #03050c; }
    .btn-sm {
      padding: 7px 11px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.45);
      background: rgba(251, 191, 36, 0.14); color: var(--amber); font-size: 11px; font-weight: 800; cursor: pointer;
    }
    .btn-up {
      padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(34, 211, 238, 0.45);
      background: rgba(34, 211, 238, 0.16); color: var(--cyan); font-size: 11px; font-weight: 800; cursor: pointer;
      display: inline-block; text-align: center;
    }
    .bar { width: 100%; height: 11px; background: var(--input); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width 0.25s; }
    .err {
      margin-top: 10px; padding: 10px; border-radius: 9px;
      background: rgba(244, 63, 94, 0.16); border: 1px solid var(--crimson);
      color: #fecdd3; font-size: 12px; display: none;
    }
    .scene-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 12px; margin-top: 12px;
    }
    .sc-card {
      background: var(--input); border: 1px solid var(--border); border-radius: 12px; padding: 10px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .sc-card.missing { border-color: rgba(251, 191, 36, 0.45); }
    .sc-thumb {
      width: 100%; height: 130px; object-fit: cover; border-radius: 8px; background: #0b1120; margin-bottom: 8px;
    }
    .upload-slot {
      width: 100%; height: 130px; border-radius: 8px; border: 1px dashed rgba(34, 211, 238, 0.45);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 8px; text-align: center; margin-bottom: 8px; color: var(--muted); font-size: 11px;
    }
    video { width: 100%; border-radius: 11px; margin-top: 10px; background: #000; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">NX</div>
      <div>
        <div style="font-weight:900; font-size:15px;">NEXORA STUDIO ULTRA v8</div>
        <div style="font-size:11px; color:var(--cyan);">Auto-Hook Teaser • 1-Click Batch Upload • Fast-Pacing Retention Engine</div>
      </div>
    </div>
    <div class="chip-live" id="sys-status">Checking Engine...</div>
  </header>

  <main class="wrap">
    <!-- STEP 1: SCRIPT & RETENTION SETUP -->
    <div class="card">
      <div class="hdr-row">
        <div class="title">STEP 1: HIGH-RETENTION STORY &amp; HOOK SETUP</div>
        <button type="button" class="btn-sm" id="btn-copy-prompt">📋 Copy Fast-Cut Story Prompt</button>
      </div>

      <label for="topic">Video Title</label>
      <input type="text" id="topic" value="Raat Ke 2 Baje Uske Kamre Ka Raaz" placeholder="Enter your story title..." />

      <div class="row-2">
        <div>
          <label for="genre">Genre (Auto VFX + SFX + BGM)</label>
          <select id="genre">
            <option value="romantic" selected>Deep Romantic / Suspense Love (Bokeh, Swell)</option>
            <option value="horror">Horror / Mystery (Thunder, Sting, Shake)</option>
            <option value="funny">Funny / Meme Story (Boing, Pop, Bounce)</option>
            <option value="documentary">Documentary / Thriller (Whoosh, Pulse)</option>
          </select>
        </div>
        <div>
          <label for="aspect">Screen Format</label>
          <select id="aspect">
            <option value="16:9" selected>16:9 YouTube Long</option>
            <option value="9:16">9:16 YouTube Shorts / Reels</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div>
          <label for="voice-mode">Voice Engine (+12% Gripping Pace)</label>
          <select id="voice-mode" onchange="toggleElBox()">
            <option value="single_storyteller" selected>Single Deep Storyteller (Human Baritone)</option>
            <option value="builtin_multi">Multi-Character (Narrator/Male/Female/Child)</option>
            <option value="uploaded">Upload ElevenLabs Audio (Single or Multi)</option>
          </select>
        </div>
        <div>
          <label for="auto-hook">0:00-0:05 Climax Hook Teaser ("AAGE DEKHIYE...")</label>
          <select id="auto-hook">
            <option value="true" selected>ON — Show 5s Climax Hook at 0:00 (Max Retention)</option>
            <option value="false">OFF — Start Directly From Scene 1</option>
          </select>
        </div>
      </div>

      <div id="el-upload-box" style="display:none; padding:11px; border-radius:10px; background:var(--input); border:1px solid var(--border); margin-bottom:12px;">
        <label for="el-file">Upload ElevenLabs MP3 / WAV (Exact Word Captions &amp; Visuals Auto-Sync!)</label>
        <input type="file" id="el-file" accept=".mp3,.wav,.m4a,.ogg" style="margin-bottom:8px; font-size:12px;" />
        <button type="button" class="btn-sm" onclick="uploadElAudio()">⬆ Upload ElevenLabs Audio</button>
        <div id="el-msg" style="font-size:11px; color:#34d399; margin-top:6px;"></div>
      </div>

      <label for="custom-script">Paste 4-Column Script (Speaker | English Image Prompt | Hinglish Caption | Hindi Dub)</label>
      <textarea id="custom-script" placeholder="Paste your 4-column script here..."></textarea>

      <button class="btn btn-primary" onclick="loadSceneSlots()">⚡ Step 1: Load Scene Slots (Instant)</button>
      <div class="err" id="err-box"></div>
    </div>

    <!-- STEP 2: 1-CLICK BATCH IMAGE UPLOAD & PROMPT COPIER -->
    <div class="card" id="review-card" style="display:none;">
      <div class="hdr-row">
        <div class="title">STEP 2: UPLOAD IMAGES (BATCH OR ONE-BY-ONE)</div>
        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <button type="button" class="btn-sm" onclick="copyAllPrompts(this)">📋 Copy All Prompts</button>
          <label class="btn-up" style="margin:0; background:rgba(16,185,129,0.18); border-color:#10b981; color:#34d399;">
            ⚡ Batch Upload All Images
            <input type="file" accept="image/*" multiple style="display:none;" onchange="batchUploadImages(this)" />
          </label>
          <span id="prep-msg" style="font-size:12px; color:var(--amber); font-weight:800;">0 Ready</span>
        </div>
      </div>

      <div class="scene-grid" id="scene-grid"></div>

      <div style="margin-top:16px;">
        <button class="btn btn-green" onclick="startFinalRender()">🎬 Step 2: Render High-Retention Cinema Video</button>
      </div>
    </div>

    <!-- STEP 3: LIVE FINAL VIDEO RENDER -->
    <div class="card" id="render-card" style="display:none;">
      <div class="title" style="margin-bottom:10px;">STEP 3: LIVE RENDER PROGRESS</div>
      <div id="scene-txt" style="font-size:13px; font-weight:700;">Starting render...</div>
      <div class="bar"><div class="fill" id="prog-fill"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);">
        <span id="job-lbl">Job: —</span>
        <span id="pct-lbl">0%</span>
      </div>
      <div id="result-box"></div>
    </div>
  </main>

  <script>
    let currentSessionId = "";
    let currentScenesCache = [];
    let uploadedAudioId = "";
    let pollTimer = null;

    function toggleElBox() {
      const v = document.getElementById("voice-mode").value;
      document.getElementById("el-upload-box").style.display = v === "uploaded" ? "block" : "none";
    }

    function showErr(msg) {
      const el = document.getElementById("err-box");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        document.getElementById("sys-status").textContent = d.voice_ready ? "NEXORA v8 Ready" : "FFmpeg Ready";
      } catch (e) {
        document.getElementById("sys-status").textContent = "Waking Server...";
      }
    }

    async function uploadElAudio() {
      const inp = document.getElementById("el-file");
      if (!inp.files || !inp.files[0]) return;
      const fd = new FormData();
      fd.append("audio", inp.files[0]);
      document.getElementById("el-msg").textContent = "Uploading ElevenLabs voiceover...";
      const r = await fetch("/api/audio/upload", { method: "POST", body: fd });
      const d = await r.json();
      if (r.ok) {
        uploadedAudioId = d.audio_id;
        document.getElementById("el-msg").textContent = `✅ Ready: ${d.file_name}`;
      } else {
        document.getElementById("el-msg").textContent = d.error || "Upload failed";
      }
    }

    document.getElementById("btn-copy-prompt").onclick = () => {
      const topicVal = document.getElementById("topic").value.trim() || "Raat Ke 2 Baje Uske Kamre Ka Raaz";
      const genreVal = document.getElementById("genre").value;
      const prompt = `Write a gripping, high-retention Hindi ${genreVal} story script on: "${topicVal}".
CRITICAL RETENTION RULES:
1. Keep every scene short (12 to 18 spoken words max per line) so visuals change every 4 seconds! Create 20 to 35 fast-paced scenes.
2. Start Scene 1 with an immediate shocking hook or mystery—NEVER a slow introduction.
3. Add an open-loop cliffhanger every 5 scenes to keep viewers hooked till the end.
4. Introduce who is speaking inside the Hindi narration before any dialogue.
5. Output ONLY pipe-separated lines with NO numbering, NO markdown, and NO extra text in this exact 4-column format:
narrator | Detailed English Cinematic Scene Image Prompt (8k photorealistic, dramatic lighting) | Crisp Hinglish Subtitle | Expressive Spoken Hindi Line in Devanagari Hindi`;

      navigator.clipboard.writeText(prompt).then(() => {
        const btn = document.getElementById("btn-copy-prompt");
        btn.textContent = "✅ Fast-Cut Prompt Copied!";
        setTimeout(() => btn.textContent = "📋 Copy Fast-Cut Story Prompt", 3000);
      });
    };

    function copyText(txt, btnEl) {
      navigator.clipboard.writeText(txt).then(() => {
        const old = btnEl.textContent;
        btnEl.textContent = "✅ Copied!";
        setTimeout(() => btnEl.textContent = old, 2000);
      });
    }

    function copyAllPrompts(btnEl) {
      if (!currentScenesCache.length) return;
      const all = currentScenesCache.map((s, i) => `Scene ${i + 1}: ${s.visual_prompt}`).join("\n");
      copyText(all, btnEl);
    }

    async function batchUploadImages(inputEl) {
      if (!inputEl.files || !inputEl.files.length || !currentSessionId) return;
      document.getElementById("prep-msg").textContent = `Uploading ${inputEl.files.length} images...`;
      const fd = new FormData();
      // Sort files alphabetically/numerically by filename so they map cleanly to Scene 1..N
      const sorted = Array.from(inputEl.files).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
      sorted.forEach(file => fd.append("images", file));

      const r = await fetch(`/api/session/${currentSessionId}/batch_upload`, { method: "POST", body: fd });
      if (r.ok) {
        refreshSessionGrid();
      } else {
        alert("Batch upload failed.");
      }
    }

    async function uploadSceneImg(idx, inputEl) {
      if (!inputEl.files || !inputEl.files[0] || !currentSessionId) return;
      const fd = new FormData();
      fd.append("image", inputEl.files[0]);
      const r = await fetch(`/api/session/${currentSessionId}/replace/${idx}`, { method: "POST", body: fd });
      if (r.ok) {
        refreshSessionGrid();
      } else {
        alert("Failed to upload image.");
      }
    }

    async function refreshSessionGrid() {
      if (!currentSessionId) return;
      const r = await fetch(`/api/session/${currentSessionId}`);
      if (!r.ok) return;
      const sess = await r.json();
      currentScenesCache = sess.scenes || [];

      const readyCnt = currentScenesCache.filter(s => s.image_ready).length;
      document.getElementById("prep-msg").textContent = `${readyCnt}/${currentScenesCache.length} Ready`;

      const grid = document.getElementById("scene-grid");
      grid.innerHTML = "";
      const ts = Date.now();

      currentScenesCache.forEach((sc, idx) => {
        const card = document.createElement("div");
        card.className = "sc-card" + (sc.image_ready ? "" : " missing");

        const visualHtml = sc.image_ready
          ? `<img class="sc-thumb" src="/api/session/${currentSessionId}/image/${idx}?t=${ts}" alt="Scene ${idx + 1}" />`
          : `<div class="upload-slot">
               <div style="font-weight:900; color:var(--amber); margin-bottom:4px;">SCENE ${idx + 1}</div>
               <div>${sc.anim_type} • ${sc.sfx_type}</div>
             </div>`;

        const safePrompt = sc.visual_prompt.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        card.innerHTML = `
          <div>
            <div style="display:flex; justify-content:space-between; font-size:11px; font-weight:800; margin-bottom:6px;">
              <span style="color:var(--cyan);">SCENE ${idx + 1}</span>
              <span style="color:${sc.image_ready ? '#34d399' : '#fbbf24'};">${sc.image_ready ? 'READY' : 'EMPTY'}</span>
            </div>
            ${visualHtml}
            <div style="font-size:11px; color:var(--text); margin-bottom:8px; line-height:1.35;">"${sc.hinglish}"</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn-sm" style="flex:1;" onclick="copyText('${safePrompt}', this)">📋 Prompt</button>
            <label class="btn-up" style="flex:1; margin:0;">
              ${sc.image_ready ? '🔄 Change' : '⬆ Upload'}
              <input type="file" accept="image/*" style="display:none;" onchange="uploadSceneImg(${idx}, this)" />
            </label>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadSceneSlots() {
      showErr("");
      const script = document.getElementById("custom-script").value.trim();
      if (!script) {
        showErr("Paste your 4-column script first!");
        return;
      }

      const payload = {
        topic: document.getElementById("topic").value.trim(),
        genre: document.getElementById("genre").value,
        aspect_ratio: document.getElementById("aspect").value,
        voice_mode: document.getElementById("voice-mode").value,
        auto_hook: document.getElementById("auto-hook").value === "true",
        uploaded_audio_id: uploadedAudioId,
        custom_script: script
      };

      const r = await fetch("/api/prepare", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) {
        showErr(d.error || "Failed to load scenes.");
        return;
      }

      currentSessionId = d.session_id;
      document.getElementById("review-card").style.display = "block";
      document.getElementById("render-card").style.display = "none";
      refreshSessionGrid();
    }

    function autoDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startFinalRender() {
      showErr("");
      if (!currentSessionId) return;

      const r = await fetch("/api/render", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: currentSessionId })
      });
      const d = await r.json();
      if (!r.ok) {
        showErr(d.error || "Cannot start render yet.");
        return;
      }

      document.getElementById("render-card").style.display = "block";
      document.getElementById("result-box").innerHTML = "";
      document.getElementById("prog-fill").style.width = "3%";
      document.getElementById("pct-lbl").textContent = "3%";

      const jobId = d.job_id;
      document.getElementById("job-lbl").textContent = `Job: ${jobId}`;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const sr = await fetch(`/api/status/${jobId}`);
          const st = await sr.json();
          if (!sr.ok) {
            clearInterval(pollTimer);
            showErr(st.error || "Status error");
            return;
          }
          document.getElementById("prog-fill").style.width = `${st.progress}%`;
          document.getElementById("pct-lbl").textContent = `${st.progress}%`;
          document.getElementById("scene-txt").textContent = st.current_scene;

          if (st.status === "done") {
            clearInterval(pollTimer);
            const dlUrl = `/api/video/${jobId}?dl=1`;
            autoDownload(dlUrl, st.file_name);
            document.getElementById("result-box").innerHTML = `
              <a class="btn btn-green" style="margin-top:10px;" href="${dlUrl}" download="${st.file_name}">⬇ Download Cinema MP4 (${st.duration_min} min • ${st.size_mb} MB)</a>
              <video src="/api/video/${jobId}" controls playsinline></video>
            `;
          } else if (st.status === "error") {
            clearInterval(pollTimer);
            showErr(st.error || "Render failed");
          }
        } catch (e) {}
      }, 2000);
    }

    checkHealth();
  </script>
</body>
</html>
