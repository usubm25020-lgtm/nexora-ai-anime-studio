<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXUS — Reality Video Studio</title>
  <style>
    :root {
      --bg: #03050c;
      --card: rgba(11, 18, 36, 0.88);
      --input: #060a15;
      --border: rgba(34, 211, 238, 0.24);
      --cyan: #22d3ee;
      --violet: #a855f7;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #171238 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 36px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      background: rgba(3, 5, 12, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      display: grid; place-items: center; font-weight: 900; color: #03050c;
    }
    .chip-live {
      font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .wrap {
      max-width: 980px; margin: 18px auto; padding: 0 16px;
      display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 16px;
    }
    @media (max-width: 820px) { .wrap { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .title { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; color: var(--cyan); margin-bottom: 12px; }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], input[type="number"], select {
      width: 100%; background: var(--input); border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 13px;
      outline: none; margin-bottom: 12px;
    }
    input:focus, select:focus { border-color: var(--cyan); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .preset {
      padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700;
      background: rgba(34, 211, 238, 0.1); border: 1px solid rgba(34, 211, 238, 0.3);
      color: var(--cyan); cursor: pointer;
    }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 11px;
      font-size: 14px; font-weight: 900; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; }
    .btn-save { background: var(--emerald); color: #03050c; margin-top: 10px; }
    .btn-sub {
      padding: 9px 12px; border-radius: 9px; border: 1px solid var(--border);
      background: var(--input); color: var(--cyan); font-size: 12px; font-weight: 800; cursor: pointer;
    }
    .bar { width: 100%; height: 11px; background: var(--input); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width 0.25s; }
    .err {
      margin-top: 10px; padding: 10px; border-radius: 9px;
      background: rgba(244, 63, 94, 0.16); border: 1px solid var(--crimson);
      color: #fecdd3; font-size: 12px; display: none;
    }
    video { width: 100%; border-radius: 11px; margin-top: 10px; background: #000; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">NX</div>
      <div>
        <div style="font-weight:900; font-size:15px;">NEXUS REALITY STUDIO</div>
        <div style="font-size:11px; color:var(--cyan);">3D Shaded Physics • Auto-Save • Zero Storage Bloat</div>
      </div>
    </div>
    <div class="chip-live" id="sys-status">Connecting...</div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="title">1. VIDEO CONFIGURATION</div>

      <label>Quick Reality Scenarios</label>
      <div class="presets">
        <span class="preset" onclick="setTopic('What If Earth Suddenly Stopped Rotating?')">Earth Stops Rotating</span>
        <span class="preset" onclick="setTopic('What If the Moon Suddenly Disappeared?')">Moon Disappears</span>
        <span class="preset" onclick="setTopic('What If a 10-Kilometer Asteroid Approached Earth?')">10-km Asteroid</span>
      </div>

      <label for="topic">Reality Topic</label>
      <input type="text" id="topic" value="What If Earth Suddenly Stopped Rotating?" />

      <div class="row-2">
        <div>
          <label for="aspect">Aspect Ratio</label>
          <select id="aspect">
            <option value="16:9" selected>16:9 YouTube Landscape</option>
            <option value="9:16">9:16 YouTube Shorts</option>
          </select>
        </div>
        <div>
          <label for="duration">Target Duration (Sec)</label>
          <input type="number" id="duration" value="40" min="25" max="600" />
        </div>
      </div>

      <div class="row-2">
        <div>
          <label for="voice-mode">Voice Engine</label>
          <select id="voice-mode" onchange="toggleUploadBox()">
            <option value="neural_male" selected>Built-in Male Neural Voice</option>
            <option value="uploaded">Upload ElevenLabs Audio</option>
          </select>
        </div>
        <div>
          <label for="voice-accent">Male Accent</label>
          <select id="voice-accent">
            <option value="en-us" selected>US Deep Male (Andrew)</option>
            <option value="en-gb">UK Documentary (Ryan)</option>
            <option value="en-au">AU Male (William)</option>
          </select>
        </div>
      </div>

      <div id="upload-box" style="display:none; padding:10px; border-radius:10px; background:var(--input); border:1px solid var(--border); margin-bottom:12px;">
        <label for="audio-file">Select ElevenLabs MP3 / WAV File</label>
        <input type="file" id="audio-file" accept=".mp3,.wav,.m4a,.ogg" style="margin-bottom:8px; font-size:12px;" />
        <button type="button" class="btn-sub" onclick="uploadAudio()">Upload Audio File</button>
        <div id="upload-msg" style="font-size:11px; color:#34d399; margin-top:6px;"></div>
      </div>

      <button class="btn btn-primary" id="btn-render" onclick="startRender()">Generate &amp; Auto-Download MP4</button>
      <div class="err" id="err-box"></div>
    </div>

    <div class="card">
      <div class="title">2. LIVE RENDER &amp; AUTO-SAVE</div>
      <div id="scene-txt" style="font-size:13px; font-weight:700;">Ready. Rendered files auto-download and purge from server automatically.</div>
      <div class="bar"><div class="fill" id="prog-fill"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);">
        <span id="job-lbl">Job: —</span>
        <span id="pct-lbl">0%</span>
      </div>
      <div id="result-box"></div>
    </div>
  </main>

  <script>
    let uploadedAudioId = "";
    let pollTimer = null;

    function setTopic(t) {
      document.getElementById("topic").value = t;
    }

    function toggleUploadBox() {
      const mode = document.getElementById("voice-mode").value;
      document.getElementById("upload-box").style.display = mode === "uploaded" ? "block" : "none";
    }

    function showErr(msg) {
      const el = document.getElementById("err-box");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        document.getElementById("sys-status").textContent = d.neural_tts ? "Neural Male Voice Ready" : "Upload Audio Mode";
      } catch (e) {
        document.getElementById("sys-status").textContent = "Waking Server...";
      }
    }

    async function uploadAudio() {
      const inp = document.getElementById("audio-file");
      if (!inp.files || !inp.files[0]) return;
      const fd = new FormData();
      fd.append("audio", inp.files[0]);
      document.getElementById("upload-msg").textContent = "Uploading...";
      const r = await fetch("/api/audio/upload", { method: "POST", body: fd });
      const d = await r.json();
      if (r.ok) {
        uploadedAudioId = d.audio_id;
        document.getElementById("upload-msg").textContent = `Ready: ${d.file_name}`;
      } else {
        document.getElementById("upload-msg").textContent = d.error || "Upload failed";
      }
    }

    function autoDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startRender() {
      showErr("");
      document.getElementById("result-box").innerHTML = "";
      document.getElementById("prog-fill").style.width = "3%";
      document.getElementById("pct-lbl").textContent = "3%";
      document.getElementById("scene-txt").textContent = "Starting render pipeline...";

      const payload = {
        topic: document.getElementById("topic").value.trim(),
        aspect_ratio: document.getElementById("aspect").value,
        duration_sec: parseInt(document.getElementById("duration").value || "40", 10),
        voice_mode: document.getElementById("voice-mode").value,
        voice_variant: document.getElementById("voice-accent").value,
        uploaded_audio_id: uploadedAudioId
      };

      const r = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) {
        showErr(d.error || "Failed to start.");
        return;
      }

      const jobId = d.job_id;
      document.getElementById("job-lbl").textContent = `Job: ${jobId}`;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const sr = await fetch(`/api/status/${jobId}`);
          const st = await sr.json();
          if (!sr.ok) {
            clearInterval(pollTimer);
            showErr(st.error || "Status error");
            return;
          }
          document.getElementById("prog-fill").style.width = `${st.progress}%`;
          document.getElementById("pct-lbl").textContent = `${st.progress}%`;
          document.getElementById("scene-txt").textContent = st.current_scene;

          if (st.status === "done") {
            clearInterval(pollTimer);
            const dlUrl = `/api/video/${jobId}?dl=1`;
            autoDownload(dlUrl, st.file_name);
            document.getElementById("result-box").innerHTML = `
              <a class="btn btn-save" href="${dlUrl}" download="${st.file_name}">⬇ Save MP4 (${st.size_mb} MB • ${st.audio_note})</a>
              <video src="/api/video/${jobId}" controls playsinline></video>
            `;
          } else if (st.status === "error") {
            clearInterval(pollTimer);
            showErr(st.error || "Render error");
          }
        } catch (e) {}
      }, 1500);
    }

    checkHealth();
  </script>
</body>
</html>
