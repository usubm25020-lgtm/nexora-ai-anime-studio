<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NEXORA STUDIO PRO — Multi-Character Hindi Cinema &amp; ElevenLabs Sync</title>
  <style>
    :root {
      --bg: #03050c;
      --card: rgba(11, 18, 36, 0.92);
      --input: #060a15;
      --border: rgba(34, 211, 238, 0.25);
      --cyan: #22d3ee;
      --violet: #a855f7;
      --amber: #fbbf24;
      --emerald: #10b981;
      --crimson: #f43f5e;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at top right, #1f123d 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding-bottom: 36px;
    }
    .topbar {
      position: sticky; top: 0; z-index: 40;
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 18px;
      background: rgba(3, 5, 12, 0.94);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 36px; height: 36px; border-radius: 10px;
      background: linear-gradient(135deg, var(--cyan), var(--violet));
      display: grid; place-items: center; font-weight: 900; color: #03050c;
    }
    .chip-live {
      font-size: 11px; font-weight: 800; padding: 5px 11px; border-radius: 99px;
      background: rgba(16, 185, 129, 0.14); border: 1px solid rgba(16, 185, 129, 0.45);
      color: #34d399;
    }
    .wrap {
      max-width: 1020px; margin: 18px auto; padding: 0 16px;
      display: grid; grid-template-columns: 1.08fr 0.92fr; gap: 16px;
    }
    @media (max-width: 840px) { .wrap { grid-template-columns: 1fr; } }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 16px;
    }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; }
    .title { font-size: 13px; font-weight: 800; letter-spacing: 0.05em; color: var(--cyan); }
    label { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 5px; }
    input[type="text"], select, textarea {
      width: 100%; background: var(--input); border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 10px; color: var(--text); padding: 11px 12px; font-size: 13px;
      outline: none; margin-bottom: 12px; font-family: inherit;
    }
    textarea { min-height: 155px; resize: vertical; line-height: 1.5; font-size: 12px; }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      width: 100%; padding: 14px; border: none; border-radius: 11px;
      font-size: 14px; font-weight: 900; cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #fff; }
    .btn-save { background: var(--emerald); color: #03050c; margin-top: 10px; }
    .btn-copy {
      padding: 6px 11px; border-radius: 8px; border: 1px solid rgba(251, 191, 36, 0.45);
      background: rgba(251, 191, 36, 0.14); color: var(--amber); font-size: 11px; font-weight: 800; cursor: pointer;
      white-space: nowrap;
    }
    .bar { width: 100%; height: 11px; background: var(--input); border-radius: 99px; overflow: hidden; margin: 10px 0; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--cyan), var(--violet)); transition: width 0.25s; }
    .err {
      margin-top: 10px; padding: 10px; border-radius: 9px;
      background: rgba(244, 63, 94, 0.16); border: 1px solid var(--crimson);
      color: #fecdd3; font-size: 12px; display: none;
    }
    video { width: 100%; border-radius: 11px; margin-top: 10px; background: #000; border: 1px solid var(--border); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">NX</div>
      <div>
        <div style="font-weight:900; font-size:15px;">NEXORA STUDIO PRO</div>
        <div style="font-size:11px; color:var(--cyan);">Male / Female / Child Voices • ElevenLabs Auto-Sync • Clean Cinema BGM</div>
      </div>
    </div>
    <div class="chip-live" id="sys-status">Checking Engine...</div>
  </header>

  <main class="wrap">
    <div class="card">
      <div class="hdr-row">
        <div class="title">1. MULTI-VOICE &amp; STORY SETUP</div>
        <button type="button" class="btn-copy" id="btn-copy-prompt">📋 Copy Multi-Voice AI Prompt</button>
      </div>

      <label for="topic">Story / Video Title</label>
      <input type="text" id="topic" value="Raat Ke 1 Baje Aakhiri Train" placeholder="Enter Horror, Romantic, or Documentary title..." />

      <div class="row-2">
        <div>
          <label for="genre">Genre &amp; Clean BGM</label>
          <select id="genre">
            <option value="horror" selected>Horror / Mystery</option>
            <option value="romantic">Romantic / Love Story</option>
            <option value="documentary">Science / Documentary</option>
          </select>
        </div>
        <div>
          <label for="aspect">Screen Format</label>
          <select id="aspect">
            <option value="16:9" selected>16:9 YouTube Long</option>
            <option value="9:16">9:16 YouTube Shorts</option>
          </select>
        </div>
      </div>

      <div class="row-2">
        <div>
          <label for="voice-source">Voice Engine</label>
          <select id="voice-source" onchange="toggleElBox()">
            <option value="builtin_multi" selected>Built-in Multi-Voice (Male/Female/Child)</option>
            <option value="uploaded">Upload ElevenLabs Full Voiceover</option>
          </select>
        </div>
        <div>
          <label for="duration-min">Target Length (If No Script)</label>
          <select id="duration-min">
            <option value="0.7" selected>~1 Minute (Test)</option>
            <option value="5">5 Minutes</option>
            <option value="10">10 Minutes</option>
            <option value="15">15 Minutes</option>
          </select>
        </div>
      </div>

      <div id="el-upload-box" style="display:none; padding:11px; border-radius:10px; background:var(--input); border:1px solid var(--border); margin-bottom:12px;">
        <label for="el-file">Upload ElevenLabs MP3 / WAV (App Auto-Matches Visuals to Voice!)</label>
        <input type="file" id="el-file" accept=".mp3,.wav,.m4a,.ogg" style="margin-bottom:8px; font-size:12px;" />
        <button type="button" class="btn-copy" onclick="uploadElAudio()">⬆ Upload ElevenLabs Audio</button>
        <div id="el-msg" style="font-size:11px; color:#34d399; margin-top:6px;"></div>
      </div>

      <label for="custom-script">Multi-Character Script (Speaker | Image Prompt | Hinglish Caption | Hindi Dub)</label>
      <textarea id="custom-script" placeholder="Khali chhodne par app khud Male + Female + Child voices ke saath story banayega.&#10;&#10;Ya phir 'Copy Multi-Voice AI Prompt' dabakar Gemini/ChatGPT se script banwa kar yahan paste karein!"></textarea>

      <button class="btn btn-primary" onclick="startRender()">🎬 Generate Perfect Multi-Voice Cinema MP4</button>
      <div class="err" id="err-box"></div>
    </div>

    <div class="card">
      <div class="title" style="margin-bottom:12px;">2. LIVE PRODUCTION &amp; AUTO-SYNC</div>
      <div id="scene-txt" style="font-size:13px; font-weight:700;">Ready. Multi-character voices (Narrator, Male, Female, Child) + Phrase-synced captions active.</div>
      <div class="bar"><div class="fill" id="prog-fill"></div></div>
      <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--muted);">
        <span id="job-lbl">Job: —</span>
        <span id="pct-lbl">0%</span>
      </div>
      <div id="result-box"></div>
    </div>
  </main>

  <script>
    let uploadedAudioId = "";
    let pollTimer = null;

    function toggleElBox() {
      const v = document.getElementById("voice-source").value;
      document.getElementById("el-upload-box").style.display = v === "uploaded" ? "block" : "none";
    }

    function showErr(msg) {
      const el = document.getElementById("err-box");
      el.style.display = msg ? "block" : "none";
      el.textContent = msg || "";
    }

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        document.getElementById("sys-status").textContent = d.multi_voice ? "Multi-Voice Pro Ready" : "FFmpeg Ready";
      } catch (e) {
        document.getElementById("sys-status").textContent = "Waking Server...";
      }
    }

    async function uploadElAudio() {
      const inp = document.getElementById("el-file");
      if (!inp.files || !inp.files[0]) return;
      const fd = new FormData();
      fd.append("audio", inp.files[0]);
      document.getElementById("el-msg").textContent = "Uploading ElevenLabs voiceover...";
      const r = await fetch("/api/audio/upload", { method: "POST", body: fd });
      const d = await r.json();
      if (r.ok) {
        uploadedAudioId = d.audio_id;
        document.getElementById("el-msg").textContent = `✅ Ready: ${d.file_name} (Visuals will auto-sync to exact audio length!)`;
      } else {
        document.getElementById("el-msg").textContent = d.error || "Upload failed";
      }
    }

    document.getElementById("btn-copy-prompt").onclick = () => {
      const topicVal = document.getElementById("topic").value.trim() || "Ek Adhuri Love Story";
      const genreVal = document.getElementById("genre").value;
      const prompt = `Write a gripping, emotional, high-retention Hindi ${genreVal} script with dialogues on: "${topicVal}".
Create 25 to 45 scenes with a strong opening hook in Scene 1.
Output ONLY pipe-separated lines with NO numbering, NO markdown, and NO extra text, using this exact 4-column format:
Speaker(choose strictly one: narrator, male, female, child) | Detailed English Cinematic Scene Image Prompt | Matching Hinglish Subtitle (same length as Hindi line) | Spoken Hindi Dialogue or Narration in Devanagari Hindi`;

      navigator.clipboard.writeText(prompt).then(() => {
        const btn = document.getElementById("btn-copy-prompt");
        btn.textContent = "✅ Multi-Voice Prompt Copied!";
        setTimeout(() => btn.textContent = "📋 Copy Multi-Voice AI Prompt", 3000);
      });
    };

    function autoDownload(url, filename) {
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    async function startRender() {
      showErr("");
      document.getElementById("result-box").innerHTML = "";
      document.getElementById("prog-fill").style.width = "3%";
      document.getElementById("pct-lbl").textContent = "3%";
      document.getElementById("scene-txt").textContent = "Starting NEXORA Multi-Voice Cinema Pipeline...";

      const payload = {
        topic: document.getElementById("topic").value.trim(),
        genre: document.getElementById("genre").value,
        aspect_ratio: document.getElementById("aspect").value,
        voice_source: document.getElementById("voice-source").value,
        uploaded_audio_id: uploadedAudioId,
        duration_min: parseFloat(document.getElementById("duration-min").value || "0.7"),
        custom_script: document.getElementById("custom-script").value
      };

      const r = await fetch("/api/start", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const d = await r.json();
      if (!r.ok) {
        showErr(d.error || "Failed to start render.");
        return;
      }

      const jobId = d.job_id;
      document.getElementById("job-lbl").textContent = `Job: ${jobId}`;

      if (pollTimer) clearInterval(pollTimer);
      pollTimer = setInterval(async () => {
        try {
          const sr = await fetch(`/api/status/${jobId}`);
          const st = await sr.json();
          if (!sr.ok) {
            clearInterval(pollTimer);
            showErr(st.error || "Status error");
            return;
          }
          document.getElementById("prog-fill").style.width = `${st.progress}%`;
          document.getElementById("pct-lbl").textContent = `${st.progress}%`;
          document.getElementById("scene-txt").textContent = st.current_scene;

          if (st.status === "done") {
            clearInterval(pollTimer);
            const dlUrl = `/api/video/${jobId}?dl=1`;
            autoDownload(dlUrl, st.file_name);
            document.getElementById("result-box").innerHTML = `
              <a class="btn btn-save" href="${dlUrl}" download="${st.file_name}">⬇ Download Cinema MP4 (${st.duration_min} min • ${st.size_mb} MB)</a>
              <video src="/api/video/${jobId}" controls playsinline></video>
            `;
          } else if (st.status === "error") {
            clearInterval(pollTimer);
            showErr(st.error || "Render failed");
          }
        } catch (e) {}
      }, 2000);
    }

    checkHealth();
  </script>
</body>
</html>
